    <main>
        <div class="container" style="padding-top: 2.5rem; padding-bottom: 1rem;">

    <div id="img-modal">
        <div class="modal-backdrop">
            <img id="img-modal-img" src="" alt="">
        </div>
    </div>

    <script>
        function openModal(src, alt) {
            var m = document.getElementById('img-modal');
            var img = document.getElementById('img-modal-img');
            img.src = src;
            img.alt = alt;
            m.classList.add('open');
        }

        document.getElementById('img-modal').addEventListener('click', function (e) {
            if (e.target === this || e.target.classList.contains('modal-backdrop')) {
                this.classList.remove('open');
            }
        });

        document.getElementById('year').textContent = new Date().getFullYear();
        var themeBtn = document.getElementById('theme-toggle');
        function syncThemeLabel() { themeBtn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀︎' : '☾'; }
        syncThemeLabel();
        themeBtn.addEventListener('click', function () {
            var next = document.documentElement.getAttribute('data-theme') === 'dark' ? '' : 'dark';
            if (next) document.documentElement.setAttribute('data-theme', next); else document.documentElement.removeAttribute('data-theme');
            syncThemeLabel();
            try { localStorage.setItem('denchik-theme', next); } catch (e) {}
        });

        var wishlistData = [];
        var allTags = [];
        var activeTag = 'all';

        function favicon(url) {
            try {
                var host = new URL(url).hostname.replace(/^www\./, '');
                return '<img class="link-favicon" src="https://icons.duckduckgo.com/ip3/' + host + '.ico" alt="" loading="lazy">';
            } catch (e) {
                return '';
            }
        }

        function renderChips() {
            var defs = [{ label: 'все', value: 'all' }].concat(allTags.map(function (t) { return { label: t, value: t }; }));
            document.getElementById('tag-chips').innerHTML = defs.map(function (d) {
                return '<button class="tag-chip' + (d.value === activeTag ? ' active' : '') + '" data-tag="' + d.value + '">' + d.label + '</button>';
            }).join('');
            document.querySelectorAll('.tag-chip').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    activeTag = btn.dataset.tag;
                    renderChips();
                    renderWishlist();
                });
            });
        }

        function renderWishlist() {
            var filtered = activeTag === 'all' ? wishlistData : wishlistData.filter(function (i) { return (i.tags || []).includes(activeTag); });
            var container = document.getElementById('wishlist-list');
            if (!filtered.length) {
                container.innerHTML = '<p class="empty">пока пусто...</p>';
                return;
            }
            var rows = filtered.map(function (item) {
                var safeName = item.title.replace(/'/g, "\\'");
                var thumbHtml = item.img
                    ? '<img class="item-thumb" src="' + item.img + '" alt="' + item.title + '" loading="lazy" onclick="openModal(\'' + item.img + '\',\'' + safeName + '\')">'
                    : '';
                var tagsHtml = (item.tags && item.tags.length)
                    ? '<div class="item-tags">' + item.tags.map(function (t) { return '#' + t; }).join(' ') + '</div>'
                    : '';
                var descHtml = item.desc ? '<div class="item-desc">' + item.desc + '</div>' : '';
                var statusHtml = item.status === 'bought' ? '<span class="item-status status-bought">куплено</span>' : '';
                var linksHtml = (item.links && item.links.length)
                    ? '<div class="item-links">' + item.links.map(function (l) {
                        return '<a class="item-link" href="' + l.url + '" target="_blank" rel="noopener">' + favicon(l.url) + l.label + '</a>';
                    }).join('') + '</div>'
                    : '';
                return '<div class="item' + (item.img ? ' item-with-img' : '') + '">' + thumbHtml +
                    '<div class="item-body"><div class="item-name">' + item.title + '</div>' + tagsHtml + descHtml + '</div>' +
                    (statusHtml || linksHtml ? '<div class="item-right">' + statusHtml + linksHtml + '</div>' : '') +
                    '</div>';
            }).join('');
            container.innerHTML = '<div class="items-list">' + rows + '</div>';
        }

        Promise.all([
            fetch('data/wishlist.json').then(function (r) { return r.ok ? r.json() : []; }),
            fetch('data/tags.json').then(function (r) { return r.ok ? r.json() : []; })
        ]).then(function (results) {
            wishlistData = results[0];
            allTags = results[1];
            renderChips();
            renderWishlist();
        }).catch(function () {
            document.getElementById('wishlist-list').innerHTML = '<p class="empty">не удалось загрузить :(</p>';
        });
    </script>
