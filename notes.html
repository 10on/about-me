    <main>
        <div class="container" style="padding-top: 2.5rem; padding-bottom: 1rem;">
            <h1 style="font-size: clamp(28px, 6vw, 34px); font-weight: 600; letter-spacing: -0.01em; margin-bottom: 0.4rem;">Заметки</h1>
            <p style="font-size: 1rem; color: var(--muted); margin-bottom: 1.1rem;">Короткое и по делу — что попало под руку за неделю. Фильтруй по тегу.</p>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        var themeBtn = document.getElementById('theme-toggle');
        function syncThemeLabel() { themeBtn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀︎' : '☾'; }
        syncThemeLabel();
        themeBtn.addEventListener('click', function () {
            var next = document.documentElement.getAttribute('data-theme') === 'dark' ? '' : 'dark';
            if (next) document.documentElement.setAttribute('data-theme', next); else document.documentElement.removeAttribute('data-theme');
            syncThemeLabel();
            try { localStorage.setItem('denchik-theme', next); } catch (e) {}
        });

        var allNotes = [];
        var activeTag = 'all';
        var SHARE_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>';
        var EXPAND_LABEL = 'Показать полностью ↓';
        var COLLAPSE_LABEL = 'Свернуть ↑';

        function shareNote(btn) {
            var url = new URL(btn.dataset.url, location.href).href;
            if (navigator.share) {
                navigator.share({ url: url }).catch(function () {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(function () {
                    btn.classList.add('copied');
                    setTimeout(function () { btn.classList.remove('copied'); }, 1500);
                });
            }
        }

        function markOverflowingNotes(container) {
            container.querySelectorAll('.note-item').forEach(function (item) {
                var text = item.querySelector('.note-text');
                if (text.scrollHeight > text.clientHeight + 2) {
                    item.classList.add('has-overflow');
                }
            });
        }

        function toggleExpand(btn) {
            var text = btn.closest('.note-item').querySelector('.note-text');
            var expanded = text.classList.toggle('expanded');
            btn.textContent = expanded ? COLLAPSE_LABEL : EXPAND_LABEL;
        }

        function renderChips() {
            var tags = Array.from(new Set(allNotes.flatMap(function (n) { return n.tags; })));
            var defs = [{ label: 'все', value: 'all' }].concat(tags.map(function (t) { return { label: t, value: t }; }));
            document.getElementById('tag-chips').innerHTML = defs.map(function (d) {
                return '<button class="tag-chip' + (d.value === activeTag ? ' active' : '') + '" data-tag="' + d.value + '">' + d.label + '</button>';
            }).join('');
            document.querySelectorAll('.tag-chip').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    activeTag = btn.dataset.tag;
                    renderChips();
                    renderNotes();
                });
            });
        }

        function renderNotes() {
            var filtered = activeTag === 'all' ? allNotes : allNotes.filter(function (n) { return n.tags.includes(activeTag); });
            var container = document.getElementById('notes-list');
            if (!filtered.length) {
                container.innerHTML = '<p class="empty">скоро будет...</p>';
                return;
            }
            container.innerHTML = filtered.map(function (n) {
                return '<div class="note-item" id="note-' + n.id + '"><div class="note-meta"><span>' + n.date + '</span><span class="note-meta-right"><span class="note-tags">' +
                    n.tags.map(function (t) { return '#' + t; }).join(' ') +
                    '</span><button class="note-share" data-url="notes/' + n.id + '.html" title="Поделиться" aria-label="Поделиться">' + SHARE_ICON + '</button></span></div><p class="note-text">' + n.text + '</p><button class="note-expand-btn" type="button">' + EXPAND_LABEL + '</button></div>';
            }).join('');
            markOverflowingNotes(container);
        }

        document.getElementById('notes-list').addEventListener('click', function (e) {
            var expandBtn = e.target.closest('.note-expand-btn');
            if (expandBtn) { toggleExpand(expandBtn); return; }
            var btn = e.target.closest('.note-share');
            if (btn) shareNote(btn);
        });

        fetch('data/notes.json')
            .then(function (r) { return r.ok ? r.json() : []; })
            .then(function (notes) {
                allNotes = notes;
                renderChips();
                renderNotes();
                if (location.hash) {
                    var el = document.querySelector(location.hash);
                    if (el) {
                        var expandBtn = el.querySelector('.note-expand-btn');
                        if (expandBtn) toggleExpand(expandBtn);
                        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        el.classList.add('note-highlight');
                        setTimeout(function () { el.classList.remove('note-highlight'); }, 1600);
                    }
                }
            })
            .catch(function () {
                document.getElementById('notes-list').innerHTML = '<p class="empty">не удалось загрузить :(</p>';
            });
    </script>
