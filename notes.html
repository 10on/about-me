<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>заметки — дэнчик</title>
    <script>try{var t=localStorage.getItem('denchik-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <div>
                <a href="index.html" class="logo">дэнчик</a>
                <div class="tagline">лего · ретро · самоделки · разработка</div>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="theme-toggle" title="тема">☾</button>
            </div>
        </div>
        <nav>
            <a href="notes.html" class="active">заметки</a>
            <a href="articles.html">статьи</a>
            <a href="lego.html">лего</a>
            <a href="retro.html">ретро</a>
            <a href="diy.html">самоделки</a>
            <a href="games.html">игры</a>
            <a href="about.html">обо мне</a>
        </nav>
    </header>

    <main>
        <div class="container" style="padding-top: 2.5rem; padding-bottom: 1rem;">
            <h1 style="font-size: clamp(28px, 6vw, 34px); font-weight: 600; letter-spacing: -0.01em; margin-bottom: 0.4rem;">Заметки</h1>
            <p style="font-size: 1rem; color: var(--muted); margin-bottom: 1.1rem;">Короткое и по делу — что попало под руку за неделю. Фильтруй по тегу.</p>

            <div class="tag-chips" id="tag-chips"></div>
            <div id="notes-list"></div>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a href="https://www.youtube.com/@DenchikBricks" target="_blank" rel="noopener">youtube</a>
            <a href="http://t.me/denchik_bricks" target="_blank" rel="noopener">telegram</a>
            <a href="https://rebrickable.com/users/10on/lego/" target="_blank" rel="noopener">rebrickable</a>
            <a href="https://www.linkedin.com/in/d-push/" target="_blank" rel="noopener">linkedin</a>
            <a href="mailto:igoo10on@gmail.com">почта</a>
        </div>
        <div class="footer-meta">дэнчик — <span id="year"></span></div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        var themeBtn = document.getElementById('theme-toggle');
        function syncThemeLabel() { themeBtn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀︎' : '☾'; }
        syncThemeLabel();
        themeBtn.addEventListener('click', function () {
            var next = document.documentElement.getAttribute('data-theme') === 'dark' ? '' : 'dark';
            if (next) document.documentElement.setAttribute('data-theme', next); else document.documentElement.removeAttribute('data-theme');
            syncThemeLabel();
            try { localStorage.setItem('denchik-theme', next); } catch (e) {}
        });

        var allNotes = [];
        var activeTag = 'all';

        function renderChips() {
            var tags = Array.from(new Set(allNotes.flatMap(function (n) { return n.tags; })));
            var defs = [{ label: 'все', value: 'all' }].concat(tags.map(function (t) { return { label: t, value: t }; }));
            document.getElementById('tag-chips').innerHTML = defs.map(function (d) {
                return '<button class="tag-chip' + (d.value === activeTag ? ' active' : '') + '" data-tag="' + d.value + '">' + d.label + '</button>';
            }).join('');
            document.querySelectorAll('.tag-chip').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    activeTag = btn.dataset.tag;
                    renderChips();
                    renderNotes();
                });
            });
        }

        function renderNotes() {
            var filtered = activeTag === 'all' ? allNotes : allNotes.filter(function (n) { return n.tags.includes(activeTag); });
            var container = document.getElementById('notes-list');
            if (!filtered.length) {
                container.innerHTML = '<p class="empty">скоро будет...</p>';
                return;
            }
            container.innerHTML = filtered.map(function (n) {
                return '<div class="note-item"><div class="note-meta"><span>' + n.date + '</span><span class="note-tags">' +
                    n.tags.map(function (t) { return '#' + t; }).join(' ') +
                    '</span></div><p class="note-text">' + n.text + '</p></div>';
            }).join('');
        }

        fetch('data/notes.json')
            .then(function (r) { return r.ok ? r.json() : []; })
            .then(function (notes) {
                allNotes = notes;
                renderChips();
                renderNotes();
            })
            .catch(function () {
                document.getElementById('notes-list').innerHTML = '<p class="empty">не удалось загрузить :(</p>';
            });
    </script>
</body>
</html>
